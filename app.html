<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7FBF2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10140F">
<title>Kiffy — Material You</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23006D3B' d='M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z'/%3E%3C/svg%3E">
<style>
/* ================= Material You tokens ================= */
:root {
  --md-sys-motion: 200ms cubic-bezier(.2,0,0,1);
}
:root, :root[data-theme="light"] {
  --primary: #006D3B; --on-primary: #FFFFFF;
  --primary-container: #97F7B3; --on-primary-container: #00210C;
  --secondary: #4E6355; --secondary-container: #D1E8D6; --on-secondary-container: #0C1F14;
  --tertiary: #3B6470; --tertiary-container: #BFE9F8; --on-tertiary-container: #001F28;
  --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
  --surface: #F7FBF2; --on-surface: #191D18; --on-surface-variant: #414941;
  --surface-c-lowest: #FFFFFF; --surface-c-low: #F1F5EC; --surface-c: #EBF0E7;
  --surface-c-high: #E5EAE1; --surface-c-highest: #DFE4DB;
  --outline: #717971; --outline-v: #C1C9BF; --inverse-surface: #2E322C; --inverse-on-surface: #EFF2EA;
  --shadow: rgba(0,0,0,.26);
}
:root[data-theme="dark"] {
  --primary: #7ADB96; --on-primary: #003916;
  --primary-container: #005325; --on-primary-container: #97F7B3;
  --secondary: #B5CCBA; --secondary-container: #384B3D; --on-secondary-container: #D1E8D6;
  --tertiary: #A4CDDB; --tertiary-container: #224C57; --on-tertiary-container: #BFE9F8;
  --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
  --surface: #10140F; --on-surface: #DFE4DB; --on-surface-variant: #C1C9BF;
  --surface-c-lowest: #0B0F0A; --surface-c-low: #191D18; --surface-c: #1D211C;
  --surface-c-high: #272B26; --surface-c-highest: #323630;
  --outline: #8B938A; --outline-v: #414941; --inverse-surface: #DFE4DB; --inverse-on-surface: #191D18;
  --shadow: rgba(0,0,0,.6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --primary: #7ADB96; --on-primary: #003916;
    --primary-container: #005325; --on-primary-container: #97F7B3;
    --secondary: #B5CCBA; --secondary-container: #384B3D; --on-secondary-container: #D1E8D6;
    --tertiary: #A4CDDB; --tertiary-container: #224C57; --on-tertiary-container: #BFE9F8;
    --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
    --surface: #10140F; --on-surface: #DFE4DB; --on-surface-variant: #C1C9BF;
    --surface-c-lowest: #0B0F0A; --surface-c-low: #191D18; --surface-c: #1D211C;
    --surface-c-high: #272B26; --surface-c-highest: #323630;
    --outline: #8B938A; --outline-v: #414941; --inverse-surface: #DFE4DB; --inverse-on-surface: #191D18;
    --shadow: rgba(0,0,0,.6);
  }
}

/* ================= base ================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--surface); color: var(--on-surface);
  font-size: 14px; line-height: 1.45; overflow: hidden;
}
svg.ic { width: 24px; height: 24px; fill: currentColor; flex: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.hidden { display: none !important; }

/* state layer helper */
.iconbtn {
  width: 44px; height: 44px; border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center; color: var(--on-surface-variant);
  position: relative; overflow: hidden; transition: background var(--md-sys-motion);
}
.iconbtn:hover { background: color-mix(in srgb, var(--on-surface-variant) 12%, transparent); }
.iconbtn:active { background: color-mix(in srgb, var(--on-surface-variant) 20%, transparent); }

/* ================= layout ================= */
.app { height: 100%; display: grid; grid-template-columns: 88px 1fr; grid-template-areas: "rail main"; }
@media (min-width: 1240px) {
  .app { grid-template-columns: 88px 1fr 340px; grid-template-areas: "rail main widgets"; }
}
.rail { grid-area: rail; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 14px 0; background: var(--surface-c-low); }
.main { grid-area: main; display: flex; flex-direction: column; min-width: 0; height: 100%; }
.widgets { grid-area: auto; display: none; }

/* navigation rail destinations */
.dest { width: 72px; padding: 4px 0 6px; border-radius: 16px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; color: var(--on-surface-variant); transition: background var(--md-sys-motion); }
.dest .pill { width: 52px; height: 30px; border-radius: 14px; display: flex; align-items: center;
  justify-content: center; transition: all var(--md-sys-motion); }
.dest.active { color: var(--on-surface); }
.dest.active .pill { background: var(--secondary-container); color: var(--on-secondary-container); height: 30px; }
.dest.active { font-weight: 600; }
.dest span { font-size: 11.5px; }
.rail-spacer { flex: 1; }
@media (max-width: 899px) { .rail { display: none; } }

/* bottom navigation (mobile) */
.bottomnav { display: none; }
@media (max-width: 899px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "main"; }
  .bottomnav { display: flex; grid-area: main; align-self: end; position: fixed; bottom: 0; left: 0; right: 0;
    height: 68px; background: var(--surface-c); z-index: 40; padding-bottom: env(safe-area-inset-bottom); }
  .bottomnav .dest { flex: 1; width: auto; }
  .main { padding-bottom: 68px; }
  .dest.active .pill { width: 60px; }
}

/* top app bar */
.topbar { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 20px;
  flex: none; }
.topbar h1 { font-size: 21px; font-weight: 500; display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar h1 .logo { color: var(--primary); }
.online-chip { font-size: 12px; font-weight: 500; background: var(--secondary-container);
  color: var(--on-secondary-container); border-radius: 8px; padding: 2px 8px; white-space: nowrap; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--outline); margin: 0 8px;
  transition: background var(--md-sys-motion); }
.status-dot.on { background: var(--primary); }
.status-dot.wait { background: var(--tertiary); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* ================= chat ================= */
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.messages { flex: 1; overflow-y: auto; padding: 4px 16px 10px; scroll-behavior: smooth; }
.msg { display: flex; gap: 10px; margin: 3px 0; max-width: 100%; }
.msg .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex; align-items: center;
  justify-content: center; font-weight: 600; font-size: 13px; margin-top: 2px; user-select: none; }
.msg .bubble { background: var(--surface-c-high); border-radius: 18px; padding: 8px 14px;
  max-width: min(72ch, 78%); overflow-wrap: anywhere; }
.msg .meta { font-size: 11.5px; color: var(--on-surface-variant); display: flex; gap: 6px; align-items: center; }
.msg .meta .name { font-weight: 600; font-size: 12.5px; color: var(--on-surface); }
.msg .meta svg.ic { width: 13px; height: 13px; }
.msg .ts { font-size: 10.5px; opacity: .65; }
.msg.own { flex-direction: row-reverse; }
.msg.own .bubble { background: var(--primary-container); color: var(--on-primary-container);
  border-bottom-right-radius: 6px; }
.msg:not(.own) .bubble { border-bottom-left-radius: 6px; }
.msg.sys { justify-content: center; }
.msg.sys .bubble { background: none; color: var(--on-surface-variant); font-size: 12px; padding: 2px 10px; }
.msg.global .bubble { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.msg.pm .bubble { background: var(--secondary-container); color: var(--on-secondary-container); }
.msg.err .bubble { background: var(--error-container); color: var(--on-error-container); }

/* typing + composer */
.typingbar { min-height: 22px; padding: 0 22px 2px; font-size: 12px; color: var(--on-surface-variant); flex: none; }
.composer { padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); flex: none;
  display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.composer-row { display: flex; gap: 10px; align-items: flex-end; }
.textfield { flex: 1; border: 1px solid var(--outline); border-radius: 26px; background: var(--surface-c-low);
  display: flex; align-items: center; transition: border-color var(--md-sys-motion); }
.textfield:focus-within { border-color: var(--primary); border-width: 2px; }
.textfield input { flex: 1; background: none; border: none; outline: none; color: var(--on-surface);
  font: inherit; padding: 13px 18px; min-width: 0; }
.textfield input::placeholder { color: var(--on-surface-variant); }
.send-fab { width: 52px; height: 52px; border-radius: 16px; background: var(--primary); color: var(--on-primary);
  display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px var(--shadow);
  transition: transform var(--md-sys-motion), box-shadow var(--md-sys-motion), filter var(--md-sys-motion); }
.send-fab:hover { filter: brightness(1.08); box-shadow: 0 2px 6px var(--shadow); }
.send-fab:active { transform: scale(.94); }
.pm-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
  background: var(--secondary-container); color: var(--on-secondary-container); border-radius: 9px;
  padding: 5px 8px 5px 12px; font-size: 12.5px; font-weight: 500; }
.pm-chip button { display: flex; }

/* empty state */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; color: var(--on-surface-variant); }
.empty .logo { color: var(--primary); }
.empty h2 { color: var(--on-surface); font-weight: 500; font-size: 22px; }

/* ================= people / widgets ================= */
#viewPeople, #viewWidgetsWrap { overflow-y: auto; padding: 4px 16px 24px; }
.person { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px;
  transition: background var(--md-sys-motion); }
.person:hover { background: var(--surface-c-high); }
.person .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-weight: 600; flex: none; }
.person .pinfo { flex: 1; min-width: 0; }
.person .pname { font-weight: 500; display: flex; align-items: center; gap: 5px; }
.person .pname svg.ic { width: 15px; height: 15px; color: var(--primary); }
.person .psub { font-size: 12px; color: var(--on-surface-variant); }
.person .pactions { display: flex; gap: 2px; }
.person .pactions .iconbtn { width: 40px; height: 40px; color: var(--on-surface-variant); }

.widgets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
  align-content: start; }
@media (min-width: 1240px) { .widgets-grid { grid-template-columns: 1fr; } }
.widget { background: var(--surface-c-low); border-radius: 20px; padding: 16px; }
.widget h3 { font-size: 13px; font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase;
  letter-spacing: .06em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.widget h3 svg.ic { width: 16px; height: 16px; }
.userchips { display: flex; flex-wrap: wrap; gap: 8px; }
.userchip { display: inline-flex; align-items: center; gap: 7px; background: var(--surface-c-high);
  border-radius: 10px; padding: 5px 12px 5px 6px; font-weight: 500; font-size: 13px; cursor: pointer;
  transition: background var(--md-sys-motion); border: none; color: var(--on-surface); }
.userchip:hover { background: color-mix(in srgb, var(--primary) 16%, var(--surface-c-high)); }
.userchip .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 700; }
.userchip svg.ic { width: 13px; height: 13px; color: var(--primary); }
.kv { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13.5px; }
.kv .k { color: var(--on-surface-variant); display: flex; gap: 8px; align-items: center; }
.kv .k svg.ic { width: 16px; height: 16px; }
.kv .v { font-weight: 500; display: flex; align-items: center; gap: 6px; }
.badge { font-size: 11px; font-weight: 600; border-radius: 7px; padding: 2px 8px; }
.badge.ok { background: var(--primary-container); color: var(--on-primary-container); }
.badge.info { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.badge.warn { background: var(--error-container); color: var(--on-error-container); }
.action-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border-radius: 12px; padding: 9px 16px; font-weight: 500; font-size: 13.5px;
  display: inline-flex; align-items: center; gap: 7px; transition: filter var(--md-sys-motion), background var(--md-sys-motion); }
.btn svg.ic { width: 17px; height: 17px; }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.filled:hover { filter: brightness(1.08); }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn.tonal:hover { filter: brightness(1.05); }
.btn.text { color: var(--primary); padding: 9px 10px; }
.btn.danger { background: var(--error-container); color: var(--on-error-container); }

/* md3 switch */
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; margin: 0; }
.switch .track { position: absolute; inset: 0; border-radius: 16px; border: 2px solid var(--outline);
  background: var(--surface-c-highest); transition: all var(--md-sys-motion); }
.switch .thumb { position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--outline); transform: translateY(-50%); transition: all var(--md-sys-motion); }
.switch input:checked ~ .track { background: var(--primary); border-color: var(--primary); }
.switch input:checked ~ .thumb { left: 24px; width: 24px; height: 24px; background: var(--on-primary); }

/* ================= dialog ================= */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 90; display: flex;
  align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none;
  transition: opacity var(--md-sys-motion); }
.scrim.show { opacity: 1; pointer-events: auto; }
.dialog { background: var(--surface-c-high); border-radius: 28px; padding: 24px; width: min(400px, 100%);
  max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 30px var(--shadow);
  transform: scale(.96); transition: transform var(--md-sys-motion); }
.scrim.show .dialog { transform: scale(1); }
.dialog h2 { font-size: 21px; font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
.dialog h2 .logo { color: var(--primary); }
.dialog .sub { color: var(--on-surface-variant); font-size: 13px; margin-bottom: 18px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--on-surface-variant); margin: 0 0 5px 14px; }
.field input { width: 100%; border: 1px solid var(--outline); border-radius: 14px; background: var(--surface-c-lowest);
  padding: 13px 16px; font: inherit; color: var(--on-surface); outline: none; transition: border-color var(--md-sys-motion); }
.field input:focus { border: 2px solid var(--primary); padding: 12px 15px; }
.dialog .err { color: var(--error); font-size: 12.5px; min-height: 18px; margin: 2px 0 8px; }
.dialog .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.field .hint { font-size: 11px; color: var(--on-surface-variant); margin: 4px 0 0 14px; }

/* snackbar */
.snack { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 20px); background: var(--inverse-surface);
  color: var(--inverse-on-surface); border-radius: 10px; padding: 11px 18px; font-size: 13.5px; z-index: 100;
  opacity: 0; pointer-events: none; transition: all var(--md-sys-motion); max-width: min(90vw, 480px); }
.snack.show { opacity: 1; transform: translate(-50%, 0); }

/* widgets as side panel on wide screens */
@media (min-width: 1240px) {
  .widgets { display: flex; grid-area: widgets; flex-direction: column; gap: 12px; overflow-y: auto;
    padding: 8px 16px 20px 0; }
  .widgets .widgets-grid { display: flex; flex-direction: column; }
  #viewWidgetsWrap { display: none !important; }
  .dest[data-nav="widgets"] { display: none; }
}
@media (max-width: 1239px) {
  #viewPeople, #viewWidgetsWrap { display: none; }
  body[data-view="people"] #viewChat { display: none; }
  body[data-view="people"] #viewPeople { display: flex; }
  body[data-view="widgets"] #viewChat { display: none; }
  body[data-view="widgets"] #viewWidgetsWrap { display: grid; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--outline-v); border-radius: 4px; }
</style>
</head>
<body data-view="chat">
<div class="app">
  <!-- navigation rail (desktop) -->
  <nav class="rail">
    <button class="dest active" data-nav="chat" id="destChat">
      <span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></span>
      <span data-i18n="nav_chat">Чат</span>
    </button>
    <button class="dest" data-nav="people" id="destPeople">
      <span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span>
      <span data-i18n="nav_people">Люди</span>

    <button class="dest" data-nav="widgets" id="destWidgets">
      <span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M13 13h-2v2h2v-2zm0-8h-2v2h2V5zM9 9H7v2h2V9zm0 8H7v2h2v-2zm-4-4H3v2h2v-2zm0-8H3v2h2V5zm16 0h-2v2h2V5zm-8 4h-2v2h2V9zm8 4h-2v2h2v-2zm0-8h-2v2h2V5zm-8 12h-2v2h2v-2zm4-4h-2v2h2v-2zm0 8h-2v2h2v-2zm8-8h-2v2h2v-2zm0 8h-2v2h2v-2zM3 13h2v-2H3v2zm0 8h2v-2H3v2zm8-8h2v-2h-2v2zm0-4h2V7h-2v2z"/></svg></span>
      <span data-i18n="nav_widgets">Виджеты</span>
    </button>
    <div class="rail-spacer"></div>
    <button class="iconbtn" id="btnTheme" title="Тема">
      <svg class="ic" viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </nav>

  <main class="main">
    <header class="topbar">
      <h1><svg class="ic logo" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        Kiffy <span class="online-chip" id="onlineChip">—</span></h1>
      <div class="topbar-actions">
        <span class="status-dot" id="connDot"></span>
        <button class="iconbtn" id="btnLang" title="Language">RU</button>
        <button class="iconbtn" id="btnMenu"><svg class="ic" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
      </div>
    </header>

    <!-- CHAT -->
    <section id="viewChat" class="view">
      <div class="empty" id="emptyState">
        <svg class="ic logo" style="width:64px;height:64px" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <h2>Kiffy</h2>
        <div data-i18n="empty_sub">Свобода общения. Ваш сервер — ваши правила.</div>
        <button class="btn filled" id="btnConnect0">

<script>
"use strict";
/* ============================ i18n ============================ */
const I18N = {
  ru: { nav_chat:"Чат", nav_people:"Люди", nav_widgets:"Виджеты", connect:"Подключиться",
    empty_sub:"Свобода общения. Ваш сервер — ваши правила.", cancel:"Отмена",
    dlg_sub:"Подключение к серверу", f_server:"Сервер", f_server_hint:"IP или хост; порт как на сервере",
    f_user:"Имя пользователя", f_psk:"Пароль сервера (PSK, необязательно)",
    ph_message:"Сообщение… (/help — команды)", w_online:"Сейчас онлайн", w_server:"Сервер",
    w_actions:"Действия", w_about:"О приложении", a_addr:"Адрес", a_transport:"Шифрование",

    confirm_clear:"Чат очищен локально", msg_shortcut:"ЛС", cmd_hint:"Доступно: /users /s [имя] [текст] /anchor [имя] /unanchor /help" },

    empty_sub:"Freedom to communicate. Your server, your rules.", cancel:"Cancel",
    dlg_sub:"Connect to a server", f_server:"Server", f_server_hint:"IP or host; port as on the server",
    f_user:"Username", f_psk:"Server passphrase (PSK, optional)",
    ph_message:"Message… (/help for commands)", w_online:"Online now", w_server:"Server",
    w_actions:"Actions", w_about:"About", a_addr:"Address", a_transport:"Encryption",
    a_latency:"Latency", a_session:"Session", t_plain:"plain", t_psk:"PSK",
    act_clear:"Clear chat", act_copy:"Copy address", act_theme:"Dark theme",
    act_global:"Broadcast (admin)", p_write:"message", p_anchor:"anchor",
    p_admin:"admin", typing:"is typing…", snk_ok:"Connected", snk_lost:"Connection lost",
    snk_retry:"Reconnecting…", snk_copy:"Address copied", you:"You",
    about_text:"Minimalist messenger with no ads or tracking. v2.0 — asyncio, WebSocket, Material You.",
    confirm_clear:"Chat cleared locally", msg_shortcut:"PM", cmd_hint:"Available: /users /s [user] [text] /anchor [user] /unanchor /help" }
};
let lang = localStorage.getItem("kiffy.lang")
  || (((navigator.language || "en").startsWith("ru")) ? "ru" : "en");
function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.getElementById("btnLang").textContent = lang === "ru" ? "EN" : "RU";
  document.documentElement.lang = lang;
  renderUsers(); updateServerWidget();
}

/* ============================ state ============================ */
const S = {
  ws: null, connected: false, everConnected: false, reconnect: false,
  transport: "ws",           // "ws" (Python/Rust server) | "poll" (PHP hosting)
  apiBase: "", token: null, since: 0,
  server: "", user: "", psk: null, admin: false,
  cipherKey: null,           // {sign: CryptoKey, enc: CryptoKey}
  users: [], pmTarget: null, typingUsers: new Map(),
  latencies: [], connectTime: 0, retry: 0, closedByUs: false,
};
const $ = id => document.getElementById(id);
const messagesEl = $("messages"), inputEl = $("input");

/* ============================ fernet (WebCrypto) ============================ */
const b64u = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),
  dec: str => {
    str = str.replace(/-/g,"+").replace(/_/g,"/");
    while (str.length % 4) str += "=";
    return Uint8Array.from(atob(str), c => c.charCodeAt(0));
  }
};
async function deriveKeys(psk, nonce){
  const raw = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(psk + "|" + nonce));
  const bytes = new Uint8Array(raw);
  const sign = await crypto.subtle.importKey("raw", bytes.slice(0,16), {name:"HMAC",hash:"SHA-256"}, false, ["sign","verify"]);
  const enc  = await crypto.subtle.importKey("raw", bytes.slice(16,32), {name:"AES-CBC"}, false, ["encrypt","decrypt"]);
  return {sign, enc};
}
async function fernetEncrypt(obj){
  const data = new TextEncoder().encode(JSON.stringify(obj));   // WebCrypto applies PKCS#7 itself
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC", iv}, S.cipherKey.enc, data));
  const body = new Uint8Array(17 + ct.length);
  body[0] = 0x80; body.set(iv, 1); body.set(ct, 17);
  const mac = new Uint8Array(await crypto.subtle.sign("HMAC", S.cipherKey.sign, body));
  const token = new Uint8Array(body.length + 32);
  token.set(body); token.set(mac, body.length);
  return b64u.enc(token);
}
async function fernetDecrypt(tokenStr){
  const tok = b64u.dec(tokenStr);
  if (tok[0] !== 0x80) throw new Error("bad token");
  const mac = tok.slice(tok.length - 32);
  const ok = await crypto.subtle.verify("HMAC", S.cipherKey.sign, mac, tok.slice(0, tok.length - 32));
  if (!ok) throw new Error("bad hmac");
  const iv = tok.slice(1, 17);
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv}, S.cipherKey.enc, tok.slice(17, tok.length - 32));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ============================ transport ============================ */
async function connect(server, user, psk, adminPw){
  S.closedByUs = false;
  S.server = server; S.user = user; S.psk = psk || null;
  S.transport = "ws"; S.token = null; S.since = 0; S.cipherKey = null;
  setStatus("wait");
  try {
    await connectWs(server, user, psk, adminPw);
  } catch (e) {
    if (e && e.noWs){
      // no WebSocket endpoint here — shared PHP hosting? try long-polling
      await connectPoll(server, user, adminPw);
      S.transport = "poll";
    } else {
      throw e;
    }
  }
  updateServerWidget();
  return true;
}

async function connectWs(server, user, psk, adminPw){
  const url = /^wss?:\/\//.test(server) ? server
    : (location.protocol === "https:" ? "wss://" : "ws://") + server.replace(/^\/+/, "") + "/ws";
  let ws;
  try { ws = new WebSocket(url); } catch(e){ throw Object.assign(new Error("Bad address"), {noWs:true}); }
  S.ws = ws;
  try {
    await new Promise((res, rej) => {
      ws.onopen = res;
      ws.onerror = () => rej(Object.assign(new Error("no ws endpoint"), {noWs:true}));
      setTimeout(() => rej(Object.assign(new Error("timeout"), {noWs:true})), 5000);
    });
  } catch(e){ ws.close(); throw e; }

  ws.onmessage = async ev => {
    let m = ev.data;
    if (m instanceof ArrayBuffer) m = new TextDecoder().decode(m);
    if (S.cipherKey) { try { m = await fernetDecrypt(m); } catch(e){ return; } }
    let obj; try { obj = JSON.parse(m); } catch(e){ return; }
    handle(obj);
  };
  ws.onclose = () => { if (S.connected || S.everConnected) onDisconnected(); };

  // first server frame: nonce (PSK) or hi (plain)
  const first = await new Promise(res => { S._firstRes = res; setTimeout(() => res(null), 6000); });
  let proof = null;
  if (first && first.t === "nonce"){
    if (!psk) throw new Error(t("f_psk") + " — required");
    if (!window.isSecureContext) throw new Error("PSK needs HTTPS or localhost");
    S.cipherKey = await deriveKeys(psk, first.nonce);
    proof = [...new Uint8Array(await crypto.subtle.sign("HMAC", S.cipherKey.sign,
      new TextEncoder().encode(first.nonce)))].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  await rawSend({t:"hello", v:2, user, proof, pw: adminPw || undefined});
  if (first && first.t === "hi" && psk) snack("Server is plain — passphrase ignored");

  const resp = await new Promise(res => { S._loginRes = res; setTimeout(() => res(null), 8000); });
  if (!resp) { ws.close(); throw new Error("timeout"); }
  if (resp.t === "pw") { ws.close(); throw new Error("admin password required"); }
  if (resp.t !== "welcome") { ws.close(); throw new Error(resp.msg || "rejected"); }
  return true;
}

/* ---- PHP shared-hosting transport: HTTP long-polling over api.php ---- */
async function connectPoll(server, user, adminPw){
  const base = (location.protocol === "https:" ? "https://" : "http://") + server.replace(/^\/+|\/+$/g, "");
  let probe;
  try {
    probe = await fetch(base + "/api.php?action=probe", {cache: "no-store"}).then(r => r.json());
  } catch(e){
    throw new Error(lang === "ru" ? "Нет ни WebSocket, ни PHP-бэкенда на " + server : "No WebSocket and no PHP backend at " + server);
  }
  if (!probe.ok) throw new Error("Unknown backend at " + server);

  const resp = await fetch(base + "/api.php", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({a:"join", v:2, user, pw: adminPw || undefined})}).then(r => r.json());
  if (!resp.ok) throw new Error(resp.err || "rejected");
  S.apiBase = base; S.token = resp.token; S.since = resp.since || 0;
  handle({t:"welcome", user: resp.user, admin: !!resp.admin, users: resp.users || [], history: resp.history || [], psk: false});
  pollLoop();
}

async function pollLoop(){
  while (S.transport === "poll" && S.connected){
    try {
      const r = await fetch(S.apiBase + "/api.php?action=poll&token=" + encodeURIComponent(S.token) + "&since=" + S.since);
      const j = await r.json();
      if (!j.ok){
        if (j.err === "expired"){ S.connected = false; onDisconnected(); }
        return;
      }
      S.since = j.since;
      (j.events || []).forEach(handle);
      setUsers(j.users || []);
    } catch(e){
      if (S.transport !== "poll") return;
      await new Promise(res => setTimeout(res, 2000));
    }
  }
}

async function rawSend(obj){
  if (S.transport === "poll"){
    if (obj.t === "ping"){
      const t0 = Date.now();
      try {
        const r = await fetch(S.apiBase + "/api.php", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({a:"ping", token:S.token, ts:t0})}).then(r => r.json());
        if (r.ok){
          const ms = Date.now() - (r.ts || t0);
          S.latencies.push(ms); if (S.latencies.length > 10) S.latencies.shift();
          updateServerWidget();
        }
      } catch(e){}
      return;
    }
    try {
      const body = Object.assign({}, obj, {token: S.token});
      await fetch(S.apiBase + "/api.php", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(body)});
    } catch(e){}
    return;
  }
  if (!S.ws || S.ws.readyState !== 1) return;
  if (S.cipherKey) obj = await fernetEncrypt(obj);
  S.ws.send(typeof obj === "string" ? obj : JSON.stringify(obj));
}
function onDisconnected(){
  S.connected = false; S.everConnected = true; S.reconnect = true;
  setStatus("off");
  if (S.closedByUs) return;
  snack(t("snk_lost"));
  const delay = Math.min(30000, 1000 * Math.pow(2, S.retry++));
  snack(t("snk_retry") + ` (${Math.round(delay/1000)}s)`);
  setTimeout(() => connect(S.server, S.user, S.psk, null).catch(()=>{}), delay);
}

/* ============================ protocol ============================ */
function handle(m){
  switch (m.t){
    case "hi": case "nonce": if (S._firstRes){ S._firstRes(m); S._firstRes = null; } break;
    case "welcome":
      S.connected = true; S.everConnected = true; S.retry = 0; S.admin = !!m.admin;
      S.connectTime = Date.now();
      if (S.reconnect){ S.reconnect = false; messagesEl.textContent = ""; }
      setStatus("on");
      if (S._loginRes){ S._loginRes(m); S._loginRes = null; }
      $("emptyState").classList.add("hidden");
      $("messages").classList.remove("hidden");
      $("composer").classList.remove("hidden");
      setUsers(m.users);
      (m.history || []).forEach(render);
      snack(t("snk_ok") + ": " + m.user);
      updateServerWidget();
      inputEl.focus();
      break;
    case "pw": /* terminal-only flow; web sends pw with hello */ break;
    case "msg": case "pm": case "pm_sent": case "global": case "sys":
      render(m); break;
    case "error":
      if (S._loginRes){ S._loginRes(m); S._loginRes = null; }
      render(m); break;
    case "users": setUsers(m.users); break;
    case "typing":
      if (m.on) S.typingUsers.set(m.user, Date.now() + 5000);
      else S.typingUsers.delete(m.user);
      renderTyping(); break;
    case "pong": {
      const ms = Date.now() - m.ts;
      S.latencies.push(ms); if (S.latencies.length > 10) S.latencies.shift();
      updateServerWidget(); break;
    }
  }
}
function setUsers(list){
  S.users = list || [];
  $("onlineChip").textContent = S.users.length;
  renderUsers(); renderTyping();
}
function statusColor(u){ return u.a ? "var(--tertiary)" : u.s ? "var(--primary)" : "var(--outline)"; }

/* ============================ render ============================ */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function avatarEl(name, size){
  const a = el("div", "avatar");
  if (size) { a.style.width = a.style.height = size + "px"; a.style.fontSize = (size*0.38) + "px"; }
  a.textContent = (name || "?").slice(0, 2).toUpperCase();
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  a.style.background = `hsl(${h % 360} 45% ${document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? 30 : 82}%)`;
  a.style.color = `hsl(${h % 360} 45% ${document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? 88 : 18}%)`;
  return a;
}
const ICON = {
  star: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
  admin: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>',
  lock: '<svg class="ic" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10z"/></svg>',
  pin: '<svg class="ic" viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>',
  send: '<svg class="ic" viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>',
  copy: '<svg class="ic" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>',
};
const fmtTs = ts => new Date((ts || Date.now()/1000) * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
function atBottom(){ return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 60; }
function render(m){
  const d = document.createElement("div");
  const ts = el("span", "ts", fmtTs(m.ts));
  if (m.t === "msg" || m.t === "pm" || m.t === "global"){
    const own = m.from === S.user || m.t === "pm_sent";
    d.className = "msg " + (m.t === "pm" ? "pm " : m.t === "global" ? "global " : "") + (own ? "own" : "other");
    d.appendChild(avatarEl(m.from, 34));
    const b = el("div", "bubble");
    const meta = el("div", "meta");
    const nm = el("span", "name", m.t === "pm_sent" ? (t("you") + " → " + m.to) : m.from);
    meta.appendChild(nm);
    if (m.star) meta.insertAdjacentHTML("beforeend", ICON.star);
    meta.appendChild(ts);
    if (m.t === "pm") meta.insertAdjacentHTML("beforeend", ICON.lock);
    if (m.t === "global") meta.appendChild(el("span", "badge info", "GLOBAL"));
    b.appendChild(meta);
    b.appendChild(el("div", "body", m.text));
    d.appendChild(b);
  } else if (m.t === "sys"){
    d.className = "msg sys";
    const b = el("div", "bubble", m.text + "  "); b.appendChild(ts); d.appendChild(b);
  } else if (m.t === "error"){
    d.className = "msg sys err";
    const b = el("div", "bubble", "⚠ " + (m.msg || "")); d.appendChild(b);
  } else return;
  const stick = atBottom();
  messagesEl.appendChild(d);
  while (messagesEl.children.length > 500) messagesEl.firstChild.remove();
  if (stick) messagesEl.scrollTop = messagesEl.scrollHeight;
}
function renderTyping(){
  const now = Date.now();
  for (const [u, exp] of S.typingUsers) if (exp < now) S.typingUsers.delete(u);
  const names = [...S.typingUsers.keys()];
  $("typingBar").textContent = names.length ? `${names.join(", ")} ${t("typing")}` : "";
}
function renderUsers(){
  const list = $("peopleList");
  list.textContent = "";
  if (!S.users.length){
    list.appendChild(el("div", "psub", S.connected ? "—" : t("connect") + " →"));
  }
  for (const u of S.users){
    const row = el("div", "person");
    row.appendChild(avatarEl(u.n, 44));
    const info = el("div", "pinfo");
    const nm = el("div", "pname", u.n);
    if (u.s) nm.insertAdjacentHTML("beforeend", ICON.star);
    if (u.a) nm.insertAdjacentHTML("beforeend", ICON.admin);
    info.appendChild(nm);
    info.appendChild(el("div", "psub", u.a ? t("p_admin") : (u.n === S.user ? t("you") : "")));
    row.appendChild(info);
    if (u.n !== S.user && S.connected){
      const act = el("div", "pactions");
      const pm = el("button", "iconbtn", ""); pm.title = t("p_write"); pm.innerHTML = ICON.send;
      pm.onclick = () => { startPm(u.n); };
      const an = el("button", "iconbtn", ""); an.title = t("p_anchor"); an.innerHTML = ICON.pin;
      an.onclick = () => { rawSend({t:"anchor", to:u.n}); snack("⚓ " + u.n); setView("chat"); };
      act.appendChild(pm); act.appendChild(an);
      row.appendChild(act);
    }
    list.appendChild(row);
  }
}

/* ============================ widgets ============================ */
function buildWidgets(){
  const online = el("div", "widget");
  online.id = "wOnlineCard";
  online.appendChild(el("h3", "", t("w_online")));
  const chips = el("div", "userchips"); chips.id = "wOnlineChips";
  online.appendChild(chips);

  const server = el("div", "widget"); server.id = "wServerCard";
  server.appendChild(el("h3", "", t("w_server")));
  const kvAddr = el("div", "kv");
  kvAddr.appendChild(el("span", "k", t("a_addr")));
  const vAddr = el("span", "v"); vAddr.id = "wAddr"; vAddr.textContent = "—";
  kvAddr.appendChild(vAddr); server.appendChild(kvAddr);
  const kvT = el("div", "kv");
  kvT.appendChild(el("span", "k", t("a_transport")));
  const vT = el("span", "v"); vT.id = "wTransport";
  const badge = el("span", "badge warn", t("t_plain")); badge.id = "wTransportBadge";
  vT.appendChild(badge); kvT.appendChild(vT); server.appendChild(kvT);
  const kvL = el("div", "kv");
  kvL.appendChild(el("span", "k", t("a_latency")));
  const vL = el("span", "v"); vL.id = "wLatency"; vL.textContent = "—";
  kvL.appendChild(vL); server.appendChild(kvL);
  const kvS = el("div", "kv");
  kvS.appendChild(el("span", "k", t("a_session")));
  const vS = el("span", "v"); vS.id = "wSession"; vS.textContent = "—";
  kvS.appendChild(vS); server.appendChild(kvS);

  const actions = el("div", "widget");
  actions.appendChild(el("h3", "", t("w_actions")));
  const row = el("div", "action-row");
  const bClear = el("button", "btn tonal", t("act_clear"));
  bClear.onclick = () => { messagesEl.textContent = ""; snack(t("confirm_clear")); };
  const bCopy = el("button", "btn tonal", t("act_copy"));
  bCopy.innerHTML = ICON.copy + "<span></span>"; bCopy.querySelector("span").textContent = t("act_copy");
  bCopy.onclick = () => {
    navigator.clipboard.writeText(S.server || location.host).then(() => snack(t("snk_copy")));
  };
  const bGlobal = el("button", "btn tonal", t("act_global"));
  bGlobal.classList.toggle("hidden", true);
  bGlobal.onclick = () => {
    const text = prompt("📢 GLOBAL:"); if (text) rawSend({t:"msg", text:"/global " + text});
  };
  const themeRow = el("div", "kv"); themeRow.style.marginTop = "8px";
  themeRow.appendChild(el("span", "k", t("act_theme")));
  const sw = el("label", "switch");
  sw.innerHTML = '<input type="checkbox" id="themeSwitch"><span class="track"></span><span class="thumb"></span>';
  themeRow.appendChild(sw);
  row.appendChild(bClear); row.appendChild(bCopy); row.appendChild(bGlobal);
  actions.appendChild(row); actions.appendChild(themeRow);

  const about = el("div", "widget");
  about.appendChild(el("h3", "", t("w_about")));
  about.appendChild(el("div", "psub", t("about_text")));
  const gh = el("button", "btn text", "GitHub →");
  gh.onclick = () => open("https://github.com/kazitu-off/kiffy", "_blank");
  about.appendChild(gh);

  const wrap = [online, server, actions, about];
  $("viewWidgetsWrap").replaceChildren(...wrap);
  $("sideWidgets").replaceChildren(...wrap.map(w => w.cloneNode(true)));
  // rebind cloned buttons
  bindWidgets($("viewWidgetsWrap"));
  bindWidgets($("sideWidgets"));
  updateServerWidget();
}
function bindWidgets(root){
  root.querySelectorAll(".btn.tonal").forEach(b => {
    const label = b.textContent.trim();
    if (label === t("act_clear")) b.onclick = () => { messagesEl.textContent = ""; snack(t("confirm_clear")); };
    if (label === t("act_copy")) b.onclick = () => navigator.clipboard.writeText(S.server || location.host).then(() => snack(t("snk_copy")));
    if (label === t("act_global")) b.onclick = () => { const x = prompt("📢 GLOBAL:"); if (x) rawSend({t:"msg", text:"/global " + x}); };
  });
  const sw = root.querySelector("#themeSwitch");
  if (sw){
    sw.checked = document.documentElement.dataset.theme === "dark";
    sw.onchange = () => setTheme(sw.checked ? "dark" : "light");
  }
}
function updateServerWidget(){
  document.querySelectorAll("#wAddr").forEach(e => e.textContent = S.server || location.host);
  document.querySelectorAll("#wTransportBadge").forEach(e => {
    const psk = !!S.cipherKey;
    e.textContent = psk ? t("t_psk") : (S.transport === "poll" ? "POLL" : t("t_plain"));
    e.className = "badge " + (psk ? "ok" : S.transport === "poll" ? "info" : "warn");
  });
  const avg = S.latencies.length ? Math.round(S.latencies.reduce((a,b)=>a+b,0)/S.latencies.length) : null;
  document.querySelectorAll("#wLatency").forEach(e => {
    e.textContent = avg === null ? "—" : avg + " ms";
    e.style.color = avg === null ? "" : avg < 60 ? "var(--primary)" : avg < 200 ? "var(--tertiary)" : "var(--error)";
  });
  document.querySelectorAll("#wSession").forEach(e =>
    e.textContent = S.connectTime ? Math.floor((Date.now() - S.connectTime)/60000) + " min" : "—");
  document.querySelectorAll("#wOnlineChips").forEach(e => {
    e.textContent = "";
    if (!S.users.length){ const s = el("span","psub","—"); e.appendChild(s); return; }
    for (const u of S.users){
      const c = el("button", "userchip");
      c.appendChild(avatarEl(u.n, 26));
      c.appendChild(el("span", "", u.n));
      if (u.s) c.insertAdjacentHTML("beforeend", ICON.star);
      if (u.a) c.insertAdjacentHTML("beforeend", ICON.admin);
      c.onclick = () => { if (u.n !== S.user){ startPm(u.n); setView("chat"); } };
      e.appendChild(c);
    }
  });
  document.querySelectorAll(".widget .btn.tonal").forEach(b => {
    if (b.textContent.includes(t("act_global"))) b.classList.toggle("hidden", !S.admin);
  });
}
setInterval(() => {
  if (S.connected){
    rawSend({t:"ping", ts: Date.now()});
    updateServerWidget();
  }
  renderTyping();
}, 5000);

/* ============================ send ============================ */
function startPm(name){ S.pmTarget = name; $("pmTarget").textContent = name; $("pmChip").classList.remove("hidden"); inputEl.focus(); }
async function sendCurrent(){
  const text = inputEl.value.trim();
  if (!text || !S.connected) return;
  inputEl.value = "";
  sendTyping(false);
  if (text.startsWith("/")){
    const cmd = text.split(/\s+/)[0].toLowerCase();
    if (cmd === "/s"){
      const rest = text.slice(3).trim();
      const sp = rest.indexOf(" ");
      if (sp > 0){
        const to = rest.slice(0, sp), body = rest.slice(sp + 1);
        await rawSend({t:"pm", to, text: body});
        render({t:"pm_sent", to});
        return;
      }
    } else if (cmd === "/exit"){
      await rawSend({t:"exit"});
      S.closedByUs = true; S.connected = false;
      setStatus("off");
      render({t:"sys", text: "— disconnected —", ts: Math.floor(Date.now()/1000)});
      openDialog();
      return;
    } else if (cmd === "/help"){
      render({t:"sys", text: t("cmd_hint"), ts: Math.floor(Date.now()/1000)});
      return;
    } else if (cmd === "/anchor"){
      const to = text.slice(8).trim();
      await rawSend({t:"anchor", to}); return;
    } else if (cmd === "/unanchor"){
      await rawSend({t:"unanchor"}); return;
    } else if (cmd === "/users"){
      await rawSend({t:"users"}); return;
    }
  }
  if (S.pmTarget){
    await rawSend({t:"pm", to: S.pmTarget, text});
    render({t:"pm_sent", to: S.pmTarget});
  } else {
    render({t:"msg", from: S.user, text, ts: Math.floor(Date.now()/1000)});
    await rawSend({t:"msg", text});
  }
}
let lastTyping = 0;
function sendTyping(on){
  if (!S.connected) return;
  const now = Date.now();
  if (on && now - lastTyping < 2000) return;
  lastTyping = now;
  rawSend({t:"typing", on});
}
inputEl.addEventListener("input", () => sendTyping(true));
inputEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendCurrent(); } });
$("btnSend").onclick = sendCurrent;
$("pmClose").onclick = () => { S.pmTarget = null; $("pmChip").classList.add("hidden"); };

/* ============================ ui chrome ============================ */
function setView(v){
  document.body.dataset.view = v;
  $("viewPeople").classList.toggle("hidden", v !== "people");
  $("viewWidgetsWrap").classList.toggle("hidden", v !== "widgets");
  document.querySelectorAll(".dest").forEach(d => d.classList.toggle("active", d.dataset.nav === v));
  if (v === "chat") inputEl.focus();
}
document.querySelectorAll(".dest").forEach(d => d.onclick = () => setView(d.dataset.nav));
function setTheme(mode){
  document.documentElement.dataset.theme = mode;
  localStorage.setItem("kiffy.theme", mode);
  $("themeIcon").innerHTML = mode === "dark"
    ? '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>'
    : '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
  buildWidgets();
}
$("btnTheme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("btnLang").onclick = () => { lang = lang === "ru" ? "en" : "ru"; localStorage.setItem("kiffy.lang", lang); applyLang(); buildWidgets(); };
function snack(text){
  const s = $("snack");
  s.textContent = text; s.classList.add("show");
  clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove("show"), 2600);
}
function setStatus(mode){
  const dot = $("connDot");
  dot.className = "status-dot" + (mode === "on" ? " on" : mode === "wait" ? " wait" : "");
}
/* menu */
const menu = document.createElement("div");
menu.style.cssText = "position:fixed;top:60px;right:12px;z-index:80;background:var(--surface-c-high);" +
  "border-radius:14px;box-shadow:0 4px 16px var(--shadow);padding:6px;display:none;min-width:200px";
document.body.appendChild(menu);
function menuItems(){
  menu.textContent = "";
  [[t("connect") + "…", openDialog],
   [t("act_clear"), () => { messagesEl.textContent = ""; }],
   [lang === "ru" ? "Switch to English" : "Переключить на русский", () => $("btnLang").onclick()]]
  .forEach(([label, fn]) => {
    const b = el("button", "btn text", label);
    b.style.cssText = "display:flex;width:100%;justify-content:flex-start;color:var(--on-surface)";
    b.onclick = () => { menu.style.display = "none"; fn(); };
    menu.appendChild(b);
  });
}
$("btnMenu").onclick = e => { e.stopPropagation(); menuItems(); menu.style.display = menu.style.display === "block" ? "none" : "block"; };
document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.style.display = "none"; });

/* ============================ connect dialog ============================ */
function openDialog(){
  $("fServer").value = localStorage.getItem("kiffy.server") || location.host || "127.0.0.1:8888";
  $("fUser").value = localStorage.getItem("kiffy.user") || "";
  $("fPsk").value = "";
  $("fAdmin").value = "";
  $("dlgErr").textContent = "";
  $("dlgScrim").classList.add("show");
  ($("fUser").value ? $("fPsk") : $("fUser")).focus();
}
function closeDialog(){ $("dlgScrim").classList.remove("show"); }
$("btnConnect0").onclick = openDialog;
$("dlgCancel").onclick = () => { if (S.everConnected) closeDialog(); };
$("dlgScrim").addEventListener("click", e => { if (e.target === $("dlgScrim") && S.everConnected) closeDialog(); });
$("dlgConnect").onclick = async () => {
  const server = $("fServer").value.trim() || location.host;
  const user = $("fUser").value.trim();
  const psk = $("fPsk").value || null;
  const adminPw = $("fAdmin").value || null;
  const err = $("dlgErr");
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(user)){ err.textContent = "3–20: a-z A-Z 0-9 _"; return; }
  $("dlgConnect").disabled = true;
  err.textContent = "…";
  try {
    S.cipherKey = null;
    await connect(server, user, psk, adminPw);
    localStorage.setItem("kiffy.server", server);
    localStorage.setItem("kiffy.user", user);
    closeDialog();
  } catch (e){
    err.textContent = (e && e.message) || "error";
    if (S.ws && !S.connected) { try { S.ws.close(); } catch(_){} }
    setStatus("off");
  } finally {
    $("dlgConnect").disabled = false;
  }
};
$("fUser").addEventListener("keydown", e => { if (e.key === "Enter") $("dlgConnect").click(); });
$("fPsk").addEventListener("keydown", e => { if (e.key === "Enter") $("dlgConnect").click(); });

/* ============================ boot ============================ */
(function(){
  const saved = localStorage.getItem("kiffy.theme");
  if (saved) document.documentElement.dataset.theme = saved;
  else document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  buildWidgets();
  applyLang();
  setView("chat");
  openDialog();
})();
</script>
